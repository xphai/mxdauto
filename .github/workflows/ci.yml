name: core-v2-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"

      - name: Ruff lint
        run: python -m ruff check src tests tools

      - name: Ruff format
        run: python -m ruff format --check src tests tools

      - name: Validate runtime manifest sample
        run: python tools/validate_runtime_manifest.py --schema schemas/runtime-manifest.schema.json --manifest schemas/runtime-manifest.example.json

      - name: Mypy
        run: python -m mypy

      - name: Pytest
        run: python -m pytest --cov=maple_automation_core --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
