name: core-v2-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record CI start time
        id: record_ci_start
        shell: pwsh
        run: |
          "CI_STARTED_AT=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $candidateSource = (Get-Content bundles/candidate-core-v2-20260829-shadow/runtime-manifest.json | ConvertFrom-Json).source_commit
          $sourceEpoch = (git show -s --format=%ct $candidateSource).Trim()
          if ($sourceEpoch -notmatch '^\d+$') { throw "Invalid source commit epoch: $sourceEpoch" }
          "SOURCE_DATE_EPOCH=$sourceEpoch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install locked development dependencies
        id: install_dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --upgrade pip
          python -m pip install --disable-pip-version-check --no-cache-dir --requirement configs/requirements.lock

      - name: Verify dependency lock
        id: verify_dependency_lock
        run: python tools/verify_dependency_lock.py --lock configs/requirements.lock --check-installed

      - name: Ruff lint
        id: ruff_lint
        run: python -m ruff check src tests tools

      - name: Ruff format
        id: ruff_format
        run: python -m ruff format --check src tests tools

      - name: Validate runtime manifests
        id: validate_runtime_manifests
        shell: pwsh
        run: |
          python tools/validate_runtime_manifest.py --schema schemas/runtime-manifest.schema.json --manifest schemas/runtime-manifest.example.json
          python tools/validate_runtime_manifest.py --schema schemas/runtime-manifest.schema.json --manifest bundles/candidate-core-v2-20260829-shadow/runtime-manifest.json

      - name: Verify committed Candidate bundle metadata
        id: verify_candidate_bundle
        run: python tools/verify_bundle.py --bundle-dir bundles/candidate-core-v2-20260829-shadow --metadata-only --strict-g0

      - name: Mypy
        id: mypy
        run: python -m mypy

      - name: Cacheless Windows clean smoke
        id: clean_smoke
        run: python tools/run_clean_smoke.py --output evidence/clean-smoke/clean-smoke-report.json

      - name: Pytest
        id: pytest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence/ci-run | Out-Null
          python -m pytest --junitxml=evidence/ci-run/junit.xml --cov=maple_automation_core --cov-report=term-missing --cov-report=xml:evidence/ci-run/coverage.xml --cov-fail-under=90

      - name: Golden Replay
        id: golden_replay
        run: python tools/run_golden_replay.py --runs 3 --manifest bundles/candidate-core-v2-20260829-shadow/runtime-manifest.json --report evidence/ci-run/golden-replay-report.json

      - name: Shadow zero-input audit
        id: shadow_audit
        run: python tools/run_shadow.py --manifest bundles/candidate-core-v2-20260829-shadow/runtime-manifest.json --report evidence/ci-run/golden-shadow-report.json

      - name: Build wheel and sdist
        id: build
        shell: pwsh
        run: |
          python -m build --wheel --sdist --no-isolation
          Get-ChildItem dist/*.tar.gz | ForEach-Object { python tools/normalize_sdist.py --source-date-epoch $env:SOURCE_DATE_EPOCH $_.FullName }

      - name: Collect CI evidence metadata
        id: collect_ci_evidence
        if: always()
        shell: pwsh
        run: |
          $artifactArgs = @()
          Get-ChildItem -LiteralPath dist -File | ForEach-Object {
            $artifactArgs += "--artifact"
            $artifactArgs += $_.FullName
          }
          python tools/collect_ci_evidence.py `
            --output evidence/ci-run/ci-evidence.json `
            --repo-root . `
            --junit evidence/ci-run/junit.xml `
            --coverage evidence/ci-run/coverage.xml `
            --lock configs/requirements.lock `
            --manifest bundles/candidate-core-v2-20260829-shadow/runtime-manifest.json `
            --asset-index bundles/candidate-core-v2-20260829-shadow/asset-index.json `
            --evidence-index evidence/g0-candidate-core-v2-20260829/evidence-index.json `
            --bundle bundles/candidate-core-v2-20260829-shadow/bundle.json `
            --evidence-report evidence/ci-run/golden-replay-report.json `
            --evidence-report evidence/ci-run/golden-shadow-report.json `
            --evidence-report evidence/clean-smoke/clean-smoke-report.json `
            --fixture fixtures/golden/pilot_minimal_v1.json `
            --check-result "install-dependencies::${{ steps.install_dependencies.outcome }}::python -m pip install --disable-pip-version-check --no-cache-dir --requirement configs/requirements.lock" `
            --check-result "verify-dependency-lock::${{ steps.verify_dependency_lock.outcome }}::python tools/verify_dependency_lock.py --lock configs/requirements.lock --check-installed" `
            --check-result "ruff-lint::${{ steps.ruff_lint.outcome }}::python -m ruff check src tests tools" `
            --check-result "ruff-format::${{ steps.ruff_format.outcome }}::python -m ruff format --check src tests tools" `
            --check-result "validate-runtime-manifests::${{ steps.validate_runtime_manifests.outcome }}::python tools/validate_runtime_manifest.py --manifest bundles/candidate-core-v2-20260829-shadow/runtime-manifest.json" `
            --check-result "candidate-bundle::${{ steps.verify_candidate_bundle.outcome }}::python tools/verify_bundle.py --bundle-dir bundles/candidate-core-v2-20260829-shadow --metadata-only --strict-g0" `
            --check-result "mypy::${{ steps.mypy.outcome }}::python -m mypy" `
            --check-result "clean-smoke::${{ steps.clean_smoke.outcome }}::python tools/run_clean_smoke.py --output evidence/clean-smoke/clean-smoke-report.json" `
            --check-result "pytest::${{ steps.pytest.outcome }}::python -m pytest" `
            --check-result "golden-replay::${{ steps.golden_replay.outcome }}::python tools/run_golden_replay.py --runs 3 --manifest bundles/candidate-core-v2-20260829-shadow/runtime-manifest.json --report evidence/ci-run/golden-replay-report.json" `
            --check-result "shadow-audit::${{ steps.shadow_audit.outcome }}::python tools/run_shadow.py --manifest bundles/candidate-core-v2-20260829-shadow/runtime-manifest.json --report evidence/ci-run/golden-shadow-report.json" `
            --check-result "build::${{ steps.build.outcome }}::python -m build --wheel --sdist --no-isolation; python tools/normalize_sdist.py dist/*.tar.gz" `
            --workflow-result "${{ job.status }}" `
            --bundle-id candidate-core-v2-20260829-shadow `
            --release-id candidate-core-v2-20260829-shadow `
            --event $env:GITHUB_EVENT_NAME `
            --workflow-name $env:GITHUB_WORKFLOW `
            --run-id $env:GITHUB_RUN_ID `
            --run-attempt $env:GITHUB_RUN_ATTEMPT `
            --started-at $env:CI_STARTED_AT `
            @artifactArgs

      - name: Upload JUnit and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ github.run_id }}
          path: |
            evidence/ci-run/junit.xml
            evidence/ci-run/coverage.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.run_id }}
          path: dist/*
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-ci-evidence-${{ github.run_id }}
          path: evidence/ci-run/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload clean-smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-clean-smoke-${{ github.run_id }}
          path: evidence/clean-smoke/
          if-no-files-found: ignore
          retention-days: 30
